name: PictureApp
options:
  bundleIdPrefix: com.tobias
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  PictureAppCore:
    path: Packages/PictureAppCore

targets:
  PictureApp-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/macOS
    dependencies:
      - package: PictureAppCore
    settings:
      base:
        PRODUCT_NAME: PictureApp
        PRODUCT_BUNDLE_IDENTIFIER: com.tobias.pictureapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PictureApp
        INFOPLIST_KEY_NSCameraUsageDescription: "PictureApp behöver tillgång till kameran för att kunna ta en bild direkt i appen."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/macOS/PictureApp.entitlements

  PictureApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
    dependencies:
      - package: PictureAppCore
    settings:
      base:
        PRODUCT_NAME: PictureApp
        PRODUCT_BUNDLE_IDENTIFIER: com.tobias.pictureapp.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PictureApp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "PictureApp behöver tillgång till kameran för att kunna ta en bild direkt i appen."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "PictureApp sparar den bearbetade bilden i ditt Foton-bibliotek."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
