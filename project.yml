name: PictureApp
options:
  bundleIdPrefix: com.tobias
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  PictureAppCore:
    path: Packages/PictureAppCore

targets:
  PictureApp-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/macOS
    dependencies:
      - package: PictureAppCore
    settings:
      base:
        PRODUCT_NAME: PictureApp
        PRODUCT_BUNDLE_IDENTIFIER: com.tobias.pictureapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: XtraPic
        # macOS Finder/Dock-tooltips visar CFBundleName, INTE
        # CFBundleDisplayName (som mest är en iOS-grej) - utan den här
        # föll namnet tillbaka på PRODUCT_NAME ("PictureApp"), rapporterat
        # 2026-09-28.
        INFOPLIST_KEY_CFBundleName: XtraPic
        INFOPLIST_KEY_NSCameraUsageDescription: "XtraPic behöver tillgång till kameran för att kunna ta en bild direkt i appen."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/macOS/PictureApp.entitlements

  PictureApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
    info:
      path: App/iOS/Info.plist
      properties:
        # Versionsnummer från build settings (annars låses de till de
        # bokstavliga värdena i Info.plist och uppladdningar får samma build).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Bara standardkryptering (HTTPS) - slipper exportfrågan vid varje
        # uppladdning.
        ITSAppUsesNonExemptEncryption: false
        # Startskärm: nästan svart bakgrund (samma som tomtillståndets bild)
        # + den svartvita X-bilden - sömlös övergång till appens första vy.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
    dependencies:
      - package: PictureAppCore
    settings:
      base:
        PRODUCT_NAME: PictureApp
        PRODUCT_BUNDLE_IDENTIFIER: com.tobias.pictureapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: XtraPic
        INFOPLIST_KEY_CFBundleName: XtraPic
        INFOPLIST_KEY_NSCameraUsageDescription: "XtraPic behöver tillgång till kameran för att kunna ta en bild direkt i appen."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "XtraPic sparar den bearbetade bilden i ditt Foton-bibliotek."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Bara iPhone - Mac har ett eget, native mål (PictureApp-macOS).
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
